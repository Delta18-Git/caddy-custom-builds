# Workflow to build and push a Docker image to the GitHub Container Registry
name: Build caddy-custom

# Controls when the action will run
on:
  workflow_dispatch: # allows to run the workflow manually from the Actions tab
  schedule:
    - cron: "0 0 1 * *" # runs at 00:00 on the first day of every month
  push:
    branches: ["main"]
    paths:
      - caddy-custom/Dockerfile

# Prevent overlapping runs for the same workflow and ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default, individual jobs widen this where needed
permissions:
  contents: read

# Jobs to run once the workflow is triggered
jobs:
  # Job to parse the Caddy version from the reference Dockerfile.
  # The tag values are handed to the reusable workflow, which runs
  # docker/metadata-action internally and cannot read the Dockerfile itself.
  metadata:
    name: Get Caddy version
    runs-on: ubuntu-24.04

    outputs:
      version: ${{ steps.version.outputs.version }}
      name: ${{ steps.build.outputs.name }}
      image: ghcr.io/${{ github.actor }}/${{ steps.build.outputs.name }}

    steps:
      # Checkout the same commit the reusable workflow builds from.
      # actions/checkout defaults to the triggering event's ref/SHA, which is
      # also what docker/github-builder resolves its git context from.
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Find the custom build
        id: build
        run: |
          set -euo pipefail
          builds=()
          for dockerfile in */Dockerfile; do
            builds+=("$(dirname "$dockerfile")")
          done
          if [ "${#builds[@]}" -ne 1 ]; then
            echo "Expected exactly one */Dockerfile build, found: ${builds[*]:-none}" >&2
            exit 1
          fi
          echo "name=${builds[0]}" | tee -a "$GITHUB_OUTPUT"

      - name: Parse Caddy version
        id: version
        run: echo "version=$(grep -Eo 'caddy:[0-9]+\.[0-9]+\.[0-9]+$' "${{ steps.build.outputs.name }}/Dockerfile" | cut -d ':' -f2)" | tee -a "$GITHUB_OUTPUT"

  # Job to build and publish the image.
  # The reusable workflow distributes one platform per runner and assembles
  # the manifest itself, so there is no build matrix or merge job to maintain here.
  build:
    name: Build and publish Docker image
    uses: docker/github-builder/.github/workflows/build.yml@v1
    needs: metadata

    permissions:
      contents: read # to fetch the repository content
      packages: write # to push the image to ghcr.io
      id-token: write # for signing attestations and cache entries with GitHub OIDC

    with:
      output: image
      push: true
      context: .
      file: ./${{ needs.metadata.outputs.name }}/Dockerfile
      platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
      cache: true
      cache-mode: max
      meta-images: ${{ needs.metadata.outputs.image }}
      meta-tags: |
        type=semver,pattern={{version}},value=v${{ needs.metadata.outputs.version }}
        type=semver,pattern={{major}}.{{minor}},value=v${{ needs.metadata.outputs.version }}
        type=semver,pattern={{major}},value=v${{ needs.metadata.outputs.version }}
      meta-labels: |
        org.opencontainers.image.title=${{ needs.metadata.outputs.name }}
        org.opencontainers.image.description=Caddy Docker custom build
      set-meta-labels: true

    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
